name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate recipes
        run: npm run recipes:validate
      - name: Recipe JSON Schema is up to date
        run: |
          npm run recipes:schema
          git diff --exit-code recipes/schema.json
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: metonic-chrome-mv3
          path: apps/extension/.output/chrome-mv3
