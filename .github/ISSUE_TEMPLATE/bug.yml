name: Bug report
description: Something in the extension doesn't work.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: versions
    attributes:
      label: Metonic version and browser version
      placeholder: Metonic 0.0.1, Chrome 148
    validations:
      required: true
