# yaml-language-server: $schema=../schema.json
schemaVersion: 0
id: hulu
name: Hulu
category: streaming
domains:
  - hulu.com
homepage: https://www.hulu.com
thirdPartyBilling: [apple, google-play, amazon, roku, other]
actions:
  cancel:
    level: info
    url: https://secure.hulu.com/account
    instructions:
      - Sign in to Hulu in this browser and open your Account page.
      - Under "Your Subscription", select "Cancel" and continue past the offers.
      - Confirm. Access continues to the end of the billing period.
  pause:
    availability: native
    maxDuration: P12W
    autoResumes: true
    action:
      level: info
      url: https://secure.hulu.com/account
      instructions:
        - Sign in to Hulu in this browser and open your Account page.
        - Next to "Pause Your Subscription", select "Pause".
        - Pick 1 to 12 weeks and submit. The pause starts at your next billing date and billing resumes automatically.
      notes: >-
        Pausing is only offered for subscriptions billed directly by Hulu, and not for most
        bundles (for example the Disney Bundle).
verification:
  status: unverified
